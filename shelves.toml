# Build manifest for the cluster-shelf pipeline.
#
# Each [[shelf]] entry generates one printable STL: build/<name>.stl
#
# kind:
#   "tray"        – open-top hex-grid box (perforated floor + walls).
#   "drawer"      – tray with a front finger pull.
#   "bolt_holder" – press-in holder that bolts a board onto standoffs.
#   "clip_holder" – press-in holder that snaps a board under corner clips.
#
# Trays/drawers are device-agnostic boxes (boards clip into the floor via a
# holder). `device` is OPTIONAL for trays — it only sets a default height.
# Holders REQUIRE a `device` (rpi4 | rpi_zero | pico | nucleo | nrf52840dk |
# minipc).
#
# Optional per-entry overrides: height, width, depth (e.g. height = "30mm").
#
# A column is built by stacking trays (they share the 120x90 footprint and the
# corner peg/socket interlock); boards clip into each tray's hex floor; cables
# run up the back-wall notch and are dressed with wall-mounted cable holders.

# --- trays (the stackable boxes) -------------------------------------------
[[shelf]]
kind   = "tray"
name   = "tray_std"
height = "30mm"          # roomy box that fits Nucleo / nRF52840-DK + holder

[[shelf]]
kind   = "drawer"
name   = "drawer_std"
height = "30mm"

[[shelf]]
kind   = "tray"
name   = "tray_low"
height = "18mm"          # shallow box for the Pico + small MCU boards

# --- board holders (clip into a tray floor) --------------------------------
[[shelf]]
kind   = "bolt_holder"
device = "nucleo"
name   = "holder_nucleo"

[[shelf]]
kind   = "bolt_holder"
device = "nrf52840dk"
name   = "holder_nrf52840dk"

[[shelf]]
kind   = "clip_holder"
device = "pico"
name   = "holder_pico"

# --- cable management (clip into a hex wall) --------------------------------
[[shelf]]
kind   = "cable_comb"
name   = "cable_comb_4"
teeth  = 4

[[shelf]]
kind   = "cable_hook"
name   = "cable_hook"
opening = "12mm"
