# Build manifest for the cluster-shelf pipeline.
#
# Each [[shelf]] entry generates one or more printable STLs in build/.
#
# kind:
#   "tray"       – the stackable open-top hex-grid box (160 x 100 mm,
#                  perforated floor + walls) -> build/<name>.stl.
#                  Options: height, width, depth, raised_walls (full hexes low
#                  on the wall, half hexes open at the rim; for low trays).
#   "holder"     – four corner posts that plug into a tray floor and carry a
#                  board (`device`, see devices.toml) -> build/<name>_a.stl,
#                  _b.stl, ... plus build/<name>_plan.txt, which says how many
#                  of each to print and which floor cells to plug them into.
#                  `tray` names the tray it goes in (default tray_std); with
#                  --preview, build/preview_<name>.stl shows the assembly.
#   "cable_comb" / "cable_hook" – wall-mounted cable management.
#
# Shelf names must be lowercase identifiers.

# --- trays ------------------------------------------------------------------
[[shelf]]
kind   = "tray"
name   = "tray_std"
height = "30mm"          # Raspberry Pi 4, Nucleo, nRF52840-DK

[[shelf]]
kind   = "tray"
name   = "tray_low"
height = "20mm"          # Pico, Pi Zero
raised_walls = true

# --- board holders (corner posts that clip into a tray floor) ---------------
[[shelf]]
kind   = "holder"
device = "rpi4"
name   = "holder_rpi4"

[[shelf]]
kind   = "holder"
device = "rpi_zero"
name   = "holder_rpi_zero"
tray   = "tray_low"

[[shelf]]
kind   = "holder"
device = "pico"
name   = "holder_pico"
tray   = "tray_low"

[[shelf]]
kind   = "holder"
device = "nucleo"
name   = "holder_nucleo"

[[shelf]]
kind   = "holder"
device = "nrf52840dk"
name   = "holder_nrf52840dk"

# --- cable management (clip into a hex wall) --------------------------------
[[shelf]]
kind   = "cable_comb"
name   = "cable_comb_4"
teeth  = 4

[[shelf]]
kind   = "cable_hook"
name   = "cable_hook"
opening = "12mm"
