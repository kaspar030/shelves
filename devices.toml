# Board profiles for the cluster-shelf pipeline (read by scripts/build.py).
#
# Board frame: origin at the board's lower-left corner, X along `width`,
# Y along `depth`, looking at the component side. All values in mm.
#
#   width, depth, thickness   board outline
#   holes                     mounting-hole centres [x, y]
#   screw_d                   pilot-hole diameter for a self-tapping screw
#   lift                      floor top -> board underside (clear the parts and
#                             pins on the board's underside)
#   [[<board>.socket]]        connectors on the board edge:
#       edge     left | right | bottom | top (left = x 0, bottom = y 0)
#       at       centre position along that edge
#       width    connector width along the edge
#       height   connector height above the board top
#       overhang how far it sticks out past the board edge
#
# `verified` says where the numbers come from. Anything marked "measure" is
# an approximation: check it against your board before printing.

# --- Raspberry Pi 4 Model B -------------------------------------------------
# Official mechanical drawing (rpi4 rev 4.0). Same outline/holes as the Pi 5,
# but Pi 5 sockets differ (Ethernet and USB swapped).
[rpi4]
name = "Raspberry Pi 4 Model B"
verified = "official mechanical drawing (from memory, well known values)"
width = 85.0
depth = 56.0
thickness = 1.4
holes = [[3.5, 3.5], [61.5, 3.5], [3.5, 52.5], [61.5, 52.5]]
screw_d = 2.5            # M2.5
lift = 4.0

[[rpi4.socket]]
name = "USB-A x2 (USB 2.0)"
edge = "right"
at = 9.0
width = 13.2
height = 16.0
overhang = 2.5

[[rpi4.socket]]
name = "USB-A x2 (USB 3.0)"
edge = "right"
at = 27.0
width = 13.2
height = 16.0
overhang = 2.5

[[rpi4.socket]]
name = "Ethernet RJ45"
edge = "right"
at = 45.75
width = 16.0
height = 13.5
overhang = 2.5

[[rpi4.socket]]
name = "USB-C power"
edge = "bottom"
at = 11.2
width = 9.0
height = 3.3
overhang = 1.3

[[rpi4.socket]]
name = "micro-HDMI 0"
edge = "bottom"
at = 26.0
width = 7.0
height = 3.0
overhang = 1.3

[[rpi4.socket]]
name = "micro-HDMI 1"
edge = "bottom"
at = 39.5
width = 7.0
height = 3.0
overhang = 1.3

[[rpi4.socket]]
name = "3.5mm A/V jack"
edge = "bottom"
at = 53.5
width = 7.0
height = 6.0
overhang = 2.5

