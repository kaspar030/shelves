# --- Raspberry Pi Pico / Pico 2 --------------------------------------------
# With soldered pin headers pointing down, raise `lift` to ~9.
[pico]
name = "Raspberry Pi Pico / Pico 2"
verified = "Pico datasheet (from memory, well known values)"
width = 51.0
depth = 21.0
thickness = 1.0
holes = [[2.0, 4.8], [2.0, 16.2], [49.0, 4.8], [49.0, 16.2]]
screw_d = 1.8            # M2 self-tapping into 2.1mm board holes
lift = 3.0

[[pico.socket]]
name = "micro-USB"
edge = "left"
at = 10.5
width = 8.0
height = 3.0
overhang = 1.3

# --- ST Nucleo-64 ----------------------------------------------------------
# MEASURE: hole positions and the ST-LINK USB position below are rough
# approximations; the exact values depend on the board revision (MB1136 has
# mini-USB, MB1717/MB2046 have USB-C). The morpho pins stick out underneath.
[nucleo]
name = "ST Nucleo-64"
verified = "measure (approximate)"
width = 70.0
depth = 82.5
thickness = 1.6
holes = [[5.0, 5.25], [65.0, 5.25], [5.0, 77.25], [65.0, 77.25]]
screw_d = 2.8            # M3 self-tapping
lift = 10.0

[[nucleo.socket]]
name = "ST-LINK USB"
edge = "top"
at = 35.0
width = 12.0
height = 4.5
overhang = 1.5

# --- Nordic nRF52840-DK (PCA10056) -----------------------------------------
# Outline 132 x 64 mm. MEASURE: hole and connector positions are
# approximations; the DevZone says the holes follow the Arduino Uno pattern.
[nrf52840dk]
name = "Nordic nRF52840-DK"
verified = "outline measured by user; holes/connectors: measure (approximate)"
width = 132.0
depth = 64.0
thickness = 1.6
holes = [[4.0, 4.0], [128.0, 4.0], [4.0, 60.0], [128.0, 60.0]]
screw_d = 2.8            # M3 self-tapping
lift = 10.0

[[nrf52840dk.socket]]
name = "micro-USB (J-Link / interface MCU)"
edge = "left"
at = 32.0
width = 8.0
height = 3.0
overhang = 1.0

[[nrf52840dk.socket]]
name = "micro-USB (nRF USB)"
edge = "bottom"
at = 110.0
width = 8.0
height = 3.0
overhang = 1.0
